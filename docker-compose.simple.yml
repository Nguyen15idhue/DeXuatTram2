services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: station-frontend
    environment:
      - VITE_API_URL=/api
      - VITE_TURNSTILE_SITE_KEY=
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - station-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: station-backend
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SIGNATURE_FONT_DIR=/app/signature-fonts
      - SIGNATURE_FONT_REGULAR=${SIGNATURE_FONT_REGULAR:-}
      - SIGNATURE_FONT_BOLD=${SIGNATURE_FONT_BOLD:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-sheets.json
    volumes:
      - uploads_data:/app/storage/uploads
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}
        target: /run/secrets/google-sheets.json
        read_only: true
      - ${SIGNATURE_FONT_HOST_DIR:-/usr/share/fonts/truetype/msttcorefonts}:/app/signature-fonts:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - station-network

  mysql:
    image: mysql:8.0.44-debian
    container_name: station-mysql
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    networks:
      - station-network

volumes:
  mysql_data:
  uploads_data:

networks:
  station-network:
    driver: bridge
