services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: station-frontend
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - station-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: station-backend
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - station-network

  mysql:
    image: mysql:8.0
    container_name: station-mysql
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - station-network

volumes:
  mysql_data:
  uploads_data:

networks:
  station-network:
    driver: bridge
